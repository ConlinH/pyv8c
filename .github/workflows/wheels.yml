name: Build wheels

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Build and test Windows x64
        type: boolean
        default: true
      linux:
        description: Build and test Linux x64
        type: boolean
        default: true
      macos:
        description: Build and test macOS arm64
        type: boolean
        default: true
      angle:
        description: Run experimental ANGLE rendering tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.windows }}
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      PYV8_V8_JOBS: '2'
      PYV8_TARGET_CPU: x64
      PYV8_GN_ARGS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine "setuptools>=77" "setuptools-rust>=1.10,<2" wheel
      - name: Select a complete Windows SDK
        id: sdk
        shell: pwsh
        run: |
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10'
          $versions = Get-ChildItem "$sdkRoot/Include" -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' -and [version]$_.Name -ge [version]'10.0.26100.0' } |
            Sort-Object { [version]$_.Name } -Descending
          $sdk = $versions | Where-Object {
            $v = $_.Name
            (Test-Path "$sdkRoot/Include/$v/um") -and
            (Test-Path "$sdkRoot/Include/$v/shared") -and
            (Test-Path "$sdkRoot/Include/$v/ucrt") -and
            (Test-Path "$sdkRoot/Lib/$v/um/x64") -and
            (Test-Path "$sdkRoot/Lib/$v/ucrt/x64")
          } | Select-Object -First 1
          if (-not $sdk) { throw 'No complete Windows SDK found' }
          "PYV8_WINDOWS_SDK=$sdkRoot" >> $env:GITHUB_ENV
          "PYV8_WINDOWS_SDK_VERSION=$($sdk.Name)" >> $env:GITHUB_ENV
          $imageVersion = if ($env:ImageVersion) { $env:ImageVersion } else { 'unknown' }
          if ($imageVersion -eq 'unknown') { throw 'Runner image version is required for the V8 cache key' }
          $v8Version = (Get-Content pyv8/V8_VERSION -Raw).Trim()
          "PYV8_V8_VERSION=$v8Version" >> $env:GITHUB_ENV
          "v8-version=$v8Version" >> $env:GITHUB_OUTPUT
          $gnOverride = if ($null -ne $env:PYV8_GN_ARGS) { $env:PYV8_GN_ARGS } else { '' }
          $gnArgs = [Text.Encoding]::UTF8.GetBytes($gnOverride)
          $gnHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($gnArgs)).ToLowerInvariant()
          $cachePrefix = "v8-v3-${{ runner.os }}-${{ env.PYV8_TARGET_CPU }}-$($sdk.Name)-$gnHash-${{ hashFiles('pyv8/V8_VERSION', 'pyv8/v8_build.py') }}"
          $cacheKey = "$cachePrefix-$imageVersion"
          # Caches saved before this change put the image before the SDK. Keep the
          # old exact key as a fallback so the first run can still reuse them.
          $legacyKey = "v8-v3-${{ runner.os }}-${{ env.PYV8_TARGET_CPU }}-$imageVersion-$($sdk.Name)-$gnHash-${{ hashFiles('pyv8/V8_VERSION', 'pyv8/v8_build.py') }}"
          "validated-cache-prefix=$cacheKey-validated-" >> $env:GITHUB_OUTPUT
          "cache-prefix=$cachePrefix" >> $env:GITHUB_OUTPUT
          "legacy-key=$legacyKey" >> $env:GITHUB_OUTPUT
          Write-Host "Selected Windows SDK $($sdk.Name) on image $imageVersion"
      # The image version is a suffix so a runner image bump falls back to the
      # last cache built with the same SDK, GN args and V8 sources instead of
      # rebuilding V8. validate_v8_cache.py still checks the GN stamp before reuse.
      # Prefer the newest validated generation for this image. A fresh generation
      # supersedes a damaged entry without needing to overwrite or delete it.
      - name: Restore V8 build cache
        id: v8-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/include
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/out/pyv8-*.release
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/third_party/llvm-build/Release+Asserts/bin
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/third_party/llvm-build/Release+Asserts/lib
          key: ${{ steps.sdk.outputs.validated-cache-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.sdk.outputs.validated-cache-prefix }}
            ${{ steps.sdk.outputs.cache-prefix }}-
            ${{ steps.sdk.outputs.legacy-key }}
      - name: Validate restored V8 outputs
        id: validate-v8-cache
        run: python pyv8/tools/validate_v8_cache.py --restore
      - name: Build V8
        id: v8-build
        working-directory: pyv8
        run: python -c "from v8_build import V8BuildConfig; V8BuildConfig.from_environment('.', download_and_build=True).prepare()"
      - name: Build the Windows wheel
        run: |
          python -m build --wheel --outdir dist .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m twine check dist/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/*.whl | ForEach-Object {
            python tools/check_license.py --artifact $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Save V8 build cache
        if: ${{ steps.validate-v8-cache.outputs.reusable != 'true' || !startsWith(steps.v8-cache.outputs.cache-matched-key, steps.sdk.outputs.validated-cache-prefix) }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/include
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/out/pyv8-*.release
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/third_party/llvm-build/Release+Asserts/bin
            pyv8/.pyv8-build/versions/${{ steps.sdk.outputs.v8-version }}/v8/third_party/llvm-build/Release+Asserts/lib
          key: ${{ steps.sdk.outputs.validated-cache-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-wheels
          path: dist/*.whl
          if-no-files-found: error

  test:
    needs: build
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          allow-prereleases: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-wheels
          path: dist
      - name: Install wheels
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = Get-ChildItem dist/*.whl | ForEach-Object { $_.FullName }
          python -m pip install $wheels "pytest>=8.4" "pytest-asyncio>=1.4,<2" pytest-timeout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Verify installed wheels outside checkout
        working-directory: ${{ runner.temp }}
        run: python -I "${{ github.workspace }}/tools/smoke_wheels.py"
      - name: Test installed wheel native components
        working-directory: ${{ runner.temp }}
        run: python -I "${{ github.workspace }}/tools/check_installed_native.py"
      - name: Test native crash smoke on installed wheel
        working-directory: ${{ runner.temp }}
        run: python -m pytest "${{ github.workspace }}/pyv8c/tests/native/test_native_smoke.py" -q
      - name: Check architecture layering on installed wheel
        if: ${{ matrix.python == '3.12' }}
        run: python tools/check_policy.py --gates layers
      - name: Test experimental ANGLE backend
        if: ${{ inputs.angle && matrix.python == '3.12' }}
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install 'comfy-angle==0.1.1' "pytest>=8.4" "pytest-asyncio>=1.4,<2" pytest-timeout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYV8C_ANGLE_DIR = python -c "import comfy_angle; print(comfy_angle.get_lib_dir())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest "${{ github.workspace }}/pyv8c/tests/integration/test_angle_context.py" -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux-build:
    if: ${{ inputs.linux }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PYV8_V8_JOBS: '2'
      PYV8_TARGET_CPU: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Check build disk space
        id: linux-environment
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          df -h "$GITHUB_WORKSPACE"
          test -n "${ImageVersion:-}"
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "validated-cache-prefix=linux-v8-v2-x64-${{ hashFiles('pyv8/V8_VERSION', 'pyv8/v8_build.py') }}-$ImageVersion-validated-" >> "$GITHUB_OUTPUT"
          echo "v8-version=$(tr -d '\r\n' < pyv8/V8_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Create build environment
        shell: bash
        run: |
          set -euo pipefail
          venv_dir="$(mktemp -d "$RUNNER_TEMP/pyv8c-ci-venv.XXXXXX")"
          audit_dir="$(mktemp -d "$RUNNER_TEMP/pyv8c-auditwheel.XXXXXX")"
          python -m venv "$venv_dir"
          python -m venv "$audit_dir"
          echo "$audit_dir/bin" >> "$GITHUB_PATH"
          echo "$venv_dir/bin" >> "$GITHUB_PATH"
          echo "AUDITWHEEL=$audit_dir/bin/auditwheel" >> "$GITHUB_ENV"
          "$audit_dir/bin/python" -m pip install 'auditwheel>=6.4,<7' 'patchelf>=0.17,<0.19'
          "$audit_dir/bin/patchelf" --version
          "$venv_dir/bin/python" -m pip install --upgrade pip build twine 'setuptools>=77' 'setuptools-rust>=1.10,<2' wheel "pytest>=8.4" "pytest-asyncio>=1.4,<2" pytest-timeout pytest-repeat pytest-xdist
      - name: Restore V8 build cache
        id: linux-v8-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            pyv8/.pyv8-build/versions/${{ steps.linux-environment.outputs.v8-version }}/v8/include
            pyv8/.pyv8-build/versions/${{ steps.linux-environment.outputs.v8-version }}/v8/out/pyv8-x64.release
            pyv8/.pyv8-build/versions/${{ steps.linux-environment.outputs.v8-version }}/v8/third_party/llvm-build/Release+Asserts/bin/ld.lld
            pyv8/.pyv8-build/versions/${{ steps.linux-environment.outputs.v8-version }}/v8/third_party/llvm-build/Release+Asserts/bin/lld
          key: ${{ steps.linux-environment.outputs.validated-cache-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.linux-environment.outputs.validated-cache-prefix }}
            linux-v8-v2-x64-${{ hashFiles('pyv8/V8_VERSION', 'pyv8/v8_build.py') }}-
            linux-v8-v2-x64-${{ steps.linux-environment.outputs.image }}-${{ hashFiles('pyv8/V8_VERSION', 'pyv8/v8_build.py') }}
      - name: Validate restored V8 outputs
        id: validate-v8-cache
        run: python pyv8/tools/validate_v8_cache.py --restore
      - name: Prepare V8
        shell: bash
        working-directory: pyv8
        run: python -c "from v8_build import V8BuildConfig; V8BuildConfig.from_environment('.', download_and_build=True).prepare()"
      - name: Verify V8 linker
        shell: bash
        run: |
          set -euo pipefail
          linker="pyv8/.pyv8-build/versions/${{ steps.linux-environment.outputs.v8-version }}/v8/third_party/llvm-build/Release+Asserts/bin/ld.lld"
          test -x "$linker"
          "$linker" --version
      - name: Build and check Linux wheel
        shell: bash
        run: |
          set -euo pipefail
          raw_dir="$(mktemp -d "$RUNNER_TEMP/pyv8c-linux-wheel.XXXXXX")"
          python -m build --wheel --no-isolation --outdir "$raw_dir" .
          # Ubuntu 22.04 uses glibc 2.35. Auditwheel rejects binaries that need
          # newer ABI symbols and bundles eligible non-policy dependencies.
          "$AUDITWHEEL" repair --plat manylinux_2_35_x86_64 --wheel-dir dist "$raw_dir"/*.whl
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          [[ "$wheel" == *-cp312-abi3-*manylinux_2_35_x86_64*.whl ]]
          "$AUDITWHEEL" show "$wheel"
          python -m twine check --strict "$wheel"
          python tools/check_license.py --artifact "$wheel"
          python -m pip install "$wheel"
          python -m pip check
      - name: Test native argument bridge
        shell: bash
        run: python -m pytest pyv8/tests/test_argument_bridge.py -q
      - name: Verify installed wheel outside checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/tools/smoke_wheels.py"
      - name: Test installed wheel native components
        shell: bash
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/tools/check_installed_native.py"
      - name: Test native crash smoke on installed wheel
        shell: bash
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/pyv8c/tests/native/test_native_smoke.py" -q
      - name: Test experimental ANGLE backend
        if: ${{ inputs.angle }}
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python -m pip install 'comfy-angle==0.1.1'
          export PYV8C_ANGLE_DIR="$(python -c 'import comfy_angle; print(comfy_angle.get_lib_dir())')"
          python -m pytest "$GITHUB_WORKSPACE/pyv8c/tests/integration/test_angle_context.py" -q
      - name: Save V8 build cache
        if: ${{ steps.validate-v8-cache.outputs.reusable != 'true' || !startsWith(steps.linux-v8-cache.outputs.cache-matched-key, steps.linux-environment.outputs.validated-cache-prefix) }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            pyv8/.pyv8-build/versions/${{ steps.linux-environment.outputs.v8-version }}/v8/include
            pyv8/.pyv8-build/versions/${{ steps.linux-environment.outputs.v8-version }}/v8/out/pyv8-x64.release
            pyv8/.pyv8-build/versions/${{ steps.linux-environment.outputs.v8-version }}/v8/third_party/llvm-build/Release+Asserts/bin/ld.lld
            pyv8/.pyv8-build/versions/${{ steps.linux-environment.outputs.v8-version }}/v8/third_party/llvm-build/Release+Asserts/bin/lld
          key: ${{ steps.linux-environment.outputs.validated-cache-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-wheels
          path: dist/*.whl
          if-no-files-found: error

  macos-build:
    if: ${{ inputs.macos }}
    runs-on: macos-15
    timeout-minutes: 360
    env:
      PYV8_TARGET_CPU: arm64
      PYV8_V8_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Check environment
        id: environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          python --version
          df -h .
          test -n "${ImageVersion:-}"
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "validated-cache-prefix=macos-v8-arm64-${{ hashFiles('pyv8/V8_VERSION', 'pyv8/v8_build.py') }}-$ImageVersion-validated-" >> "$GITHUB_OUTPUT"
          echo "v8-version=$(tr -d '\r\n' < pyv8/V8_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Install build and test tools
        run: python -m pip install --upgrade pip build twine 'setuptools>=77' 'setuptools-rust>=1.10,<2' wheel "pytest>=8.4" "pytest-asyncio>=1.4,<2" pytest-timeout pytest-repeat pytest-xdist
      - name: Restore V8 build cache
        id: v8-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            pyv8/.pyv8-build/versions/${{ steps.environment.outputs.v8-version }}/v8/include
            pyv8/.pyv8-build/versions/${{ steps.environment.outputs.v8-version }}/v8/out/pyv8-arm64.release
          key: ${{ steps.environment.outputs.validated-cache-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.environment.outputs.validated-cache-prefix }}
            macos-v8-arm64-${{ hashFiles('pyv8/V8_VERSION', 'pyv8/v8_build.py') }}-
            macos-v8-arm64-${{ steps.environment.outputs.image }}-${{ hashFiles('pyv8/V8_VERSION', 'pyv8/v8_build.py') }}
      - name: Validate restored V8 outputs
        id: validate-v8-cache
        run: python pyv8/tools/validate_v8_cache.py --restore
      - name: Prepare V8
        working-directory: pyv8
        run: python -c "from v8_build import V8BuildConfig; V8BuildConfig.from_environment('.', download_and_build=True).prepare()"
      - name: Build and install wheel
        shell: bash
        env:
          ARCHFLAGS: -arch arm64
          MACOSX_DEPLOYMENT_TARGET: '15.0'
          _PYTHON_HOST_PLATFORM: macosx-15.0-arm64
        run: |
          set -euo pipefail
          python -m build --wheel --no-isolation --outdir dist .
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*-cp312-abi3-macosx_15_0_arm64.whl")
          with ZipFile(wheel) as archive, tempfile.TemporaryDirectory() as temporary:
              modules = [name for name in archive.namelist() if name.endswith(".so")]
              if len(modules) != 2:
                  raise SystemExit(f"Expected two native extension modules, found {modules}")
              for name in modules:
                  path = Path(temporary, Path(name).name)
                  path.write_bytes(archive.read(name))
                  arch = subprocess.check_output(["lipo", "-archs", path], text=True).strip()
                  if arch != "arm64":
                      raise SystemExit(f"{name} has architectures {arch}, expected arm64")
          PY
          python -m twine check dist/*.whl
          for wheel in dist/*.whl; do python tools/check_license.py --artifact "$wheel"; done
          python -m pip install dist/*.whl
          python -m pip check
      - name: Test native argument bridge
        run: python -m pytest pyv8/tests/test_argument_bridge.py -q
      - name: Verify installed wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/tools/smoke_wheels.py"
      - name: Test installed wheel native components
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/tools/check_installed_native.py"
      - name: Test native crash smoke on installed wheel
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/pyv8c/tests/native/test_native_smoke.py" -q
      - name: Test experimental ANGLE backend
        if: ${{ inputs.angle }}
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python -m pip install 'comfy-angle==0.1.1'
          export PYV8C_ANGLE_DIR="$(python -c 'import comfy_angle; print(comfy_angle.get_lib_dir())')"
          python -m pytest "$GITHUB_WORKSPACE/pyv8c/tests/integration/test_angle_context.py" -q
      - name: Save V8 build cache
        if: ${{ steps.validate-v8-cache.outputs.reusable != 'true' || !startsWith(steps.v8-cache.outputs.cache-matched-key, steps.environment.outputs.validated-cache-prefix) }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            pyv8/.pyv8-build/versions/${{ steps.environment.outputs.v8-version }}/v8/include
            pyv8/.pyv8-build/versions/${{ steps.environment.outputs.v8-version }}/v8/out/pyv8-arm64.release
          key: ${{ steps.environment.outputs.validated-cache-prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-wheels
          path: dist/*.whl
          if-no-files-found: error
      - name: Report disk space
        if: always()
        run: df -h .
