[package]
name = "pyv8c-native"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.27.2", features = ["extension-module", "abi3-py312"] }
rustfft = "=6.4.1"
taffy = { version = "=0.11.0", default-features = false, features = ["std", "block_layout", "flexbox", "grid", "content_size", "calc"] }
unicode-linebreak = "=0.1.5"
unicode-segmentation = "=1.13.3"
# Match upstream prebuilt Skia archives for the wheel targets.
[target.'cfg(not(target_os = "macos"))'.dependencies]
skia-safe = { version = "=0.156.0", features = ["ganesh", "svg", "textlayout", "vulkan", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
skia-safe = { version = "=0.156.0", features = ["svg", "textlayout", "webp"] }

[build-dependencies]
cc = "1"
sha2 = "0.10"
